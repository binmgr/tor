variables:
  GIT_DEPTH: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/tor

stages:
  - version
  - security
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

get-version:
  stage: version
  image: alpine:3
  script:
    - apk add --no-cache curl jq
    - |
      if [ -n "${TOR_VERSION_OVERRIDE}" ]; then
        VERSION="${TOR_VERSION_OVERRIDE}"
      else
        VERSION=$(curl -fsSL https://dist.torproject.org/ | grep -oE 'tor-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' | sed -e 's/^tor-//' -e 's/\.tar\.gz$//' | sort -uV | tail -1)
      fi
      echo "TOR_VERSION=${VERSION}" > version.env
      echo "TOR_TAG=v${VERSION}" >> version.env
  artifacts:
    reports:
      dotenv: version.env

secret-scan:
  stage: security
  image:
    name: trufflesecurity/trufflehog:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - trufflehog git file://. --since-commit HEAD~1 --fail --only-verified

image-scan:
  stage: security
  image: alpine:3
  variables:
    TRIVY_VERSION: '0.70.0'
  script:
    - apk add --no-cache wget
    - wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
    - tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
    - |
      # Build image is informational only (contains many tools)
      ./trivy image --exit-code 0 --severity CRITICAL,HIGH --no-progress "${REGISTRY}/${IMAGE_NAME}:build" || true
    - |
      # Runtime image is the distributed artifact — fail on CRITICAL/HIGH CVEs
      if ./trivy image --exit-code 0 --severity LOW "${REGISTRY}/${IMAGE_NAME}:latest" > /dev/null 2>&1; then
        ./trivy image --exit-code 1 --severity CRITICAL,HIGH --no-progress "${REGISTRY}/${IMAGE_NAME}:latest"
      else
        echo "Runtime image not yet published — skipping scan"
      fi

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [get-version]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - |
      # Try the published build image, else build it locally (self-hosted runners without registry access)
      if docker pull "${REGISTRY}/${IMAGE_NAME}:build"; then
        docker tag "${REGISTRY}/${IMAGE_NAME}:build" local/tor:build
      else
        docker build -f docker/Dockerfile.build -t local/tor:build .
      fi
    - mkdir -p artifacts
    - |
      CID="tor-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)"
      docker create --name "${CID}" local/tor:build build-tor "${TARGET_OS}-${TARGET_ARCH}" "${TOR_VERSION}" /output
      docker start -a "${CID}"
      docker cp "${CID}:/output/tor-${TARGET_OS}-${TARGET_ARCH}${BINARY_EXT}" artifacts/
      docker rm "${CID}"
  artifacts:
    paths: [artifacts/]
    expire_in: 1 day

build-linux-amd64:
  extends: .build
  variables: { TARGET_OS: linux, TARGET_ARCH: amd64, BINARY_EXT: "" }

build-linux-arm64:
  extends: .build
  variables: { TARGET_OS: linux, TARGET_ARCH: arm64, BINARY_EXT: "" }

build-windows-amd64:
  extends: .build
  variables: { TARGET_OS: windows, TARGET_ARCH: amd64, BINARY_EXT: ".exe" }

build-windows-arm64:
  extends: .build
  variables: { TARGET_OS: windows, TARGET_ARCH: arm64, BINARY_EXT: ".exe" }

build-darwin-amd64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: amd64, BINARY_EXT: "" }

build-darwin-arm64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: arm64, BINARY_EXT: "" }

build-freebsd-amd64:
  extends: .build
  variables: { TARGET_OS: freebsd, TARGET_ARCH: amd64, BINARY_EXT: "" }

build-freebsd-arm64:
  extends: .build
  variables: { TARGET_OS: freebsd, TARGET_ARCH: arm64, BINARY_EXT: "" }

release:
  stage: release
  image: alpine:3
  needs:
    - get-version
    - build-linux-amd64
    - build-linux-arm64
    - build-windows-amd64
    - build-windows-arm64
    - build-darwin-amd64
    - build-darwin-arm64
    - build-freebsd-amd64
    - build-freebsd-arm64
  script:
    - apk add --no-cache curl jq coreutils
    - |
      cd artifacts
      chmod +x tor-linux-* tor-darwin-* tor-freebsd-*
      sha256sum tor-* > checksums.txt

      curl -sf -X DELETE -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TOR_TAG}" || true
      curl -sf -X DELETE -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/${TOR_TAG}" || true
      curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags" \
        -d "tag_name=${TOR_TAG}&ref=${CI_COMMIT_SHA}" || true
      curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        -H "Content-Type: application/json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
        -d "{\"tag_name\":\"${TOR_TAG}\",\"name\":\"Tor ${TOR_VERSION}\",\"description\":\"Tor ${TOR_VERSION} static builds\"}"

      for file in tor-* checksums.txt; do
        [ -f "$file" ] || continue
        UPLOAD=$(curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          -F "file=@${file}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads" | jq -r '.full_path')
        curl -sf -X POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TOR_TAG}/assets/links" \
          -d "name=${file}&url=${CI_SERVER_URL}/${CI_PROJECT_PATH}${UPLOAD}"
      done
