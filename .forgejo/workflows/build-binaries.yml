name: Build Binaries

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/**'
      - '.forgejo/workflows/build-binaries.yml'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      tor_version:
        description: 'tor version (empty for latest)'
        required: false
        default: ''

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get Tor version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.tor_version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(curl -fsSL https://dist.torproject.org/ | grep -oE 'tor-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' | sed -e 's/^tor-//' -e 's/\.tar\.gz$//' | sort -uV | tail -1)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: get-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: "" }
          - { os: linux,   arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
          - { os: darwin,  arch: amd64, ext: "" }
          - { os: darwin,  arch: arm64, ext: "" }
          - { os: freebsd, arch: amd64, ext: "" }
          - { os: freebsd, arch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Self-hosted runners may lack registry access: try the published image, else build it locally.
      - name: Get build image
        run: |
          if docker pull ghcr.io/binmgr/tor:build; then
            docker tag ghcr.io/binmgr/tor:build local/tor:build
          else
            docker build -f docker/Dockerfile.build -t local/tor:build .
          fi

      - name: Build tor
        env:
          TOR_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p out
          docker run --rm --name "tor-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            -v "$PWD/out:/output" local/tor:build \
            build-tor "${{ matrix.os }}-${{ matrix.arch }}" "${TOR_VERSION}" /output

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tor-${{ matrix.os }}-${{ matrix.arch }}
          path: out/tor-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 1

  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.get-version.outputs.tag }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p release
          mv artifacts/* release/
          cd release
          chmod +x tor-linux-* tor-darwin-* tor-freebsd-*
          sha256sum tor-* > checksums.txt

          RELEASE_BODY="Tor ${VERSION} static builds for Linux, Windows, macOS, FreeBSD (amd64/arm64)"

          if [ -n "${GITEA_TOKEN}" ]; then
            curl -sf -X DELETE -H "Authorization: token ${GITEA_TOKEN}" \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/tags/${TAG}" || true

            RELEASE_ID=$(curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Tor ${VERSION}\",\"body\":\"${RELEASE_BODY}\"}" \
              | jq -r '.id')

            for file in *; do
              [ -f "$file" ] || continue
              curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" \
                -F "attachment=@${file}" \
                "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${file}"
            done
          else
            gh release delete "${TAG}" --repo "${REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "${TAG}" --repo "${REPOSITORY}" --title "Tor ${VERSION}" --notes "${RELEASE_BODY}" *
          fi
